<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h1>Conradito Sorvetito 🍦</h1>
    <p>Você tem 💲<strong id="textoDinheiro"> 0</strong></p>

    <img onclick="venderSorvete()" width="100" src="https://i.pinimg.com/originals/f9/0e/f4/f90ef4a7066f2cfb176145bcaeec3302.gif"> 
    <hr />

    <ul>
        <li>Carrinho de Sorvete - 💲  <strong id ="textoCarrinhoSorvete"> 25 </strong> <button onclick="carrinhoSorvete()">COMPRAR</button> </li>
        <li>Freezer Grande - 💲 1.000   <button>COMPRAR</button> </li>
        <li>Marca Gourmet - 💲 50.000   <button>COMPRAR</button> </li>
    </ul>

    <p>Entre com uma conta para ganhar 💲 1.000 <button onclick="resgatarRecompensa()" >Resgatar Recompensa</button></p>
    
    <button onclick="painelAdministrativo()">Ir para o Painel</button>


    <script>

        let dinheiro = 0
        let dinheiroPorClique = 1
        let custoCarrinhoSorvete = 25 

        function painelAdministrativo(){
            location.href ="09_painel.html"
        }

        function venderSorvete() {
            dinheiro += dinheiroPorClique
            document.getElementById("textoDinheiro").innerHTML = dinheiro
        }

        function carrinhoSorvete() {

            if (dinheiro < custoCarrinhoSorvete) {
                alert("Dinheiro insuficiente 🙁....")
            } else {
                dinheiroPorClique += 1
                dinheiro -= custoCarrinhoSorvete
                document.getElementById("textoDinheiro").innerHTML = dinheiro
                custoCarrinhoSorvete += parseInt(custoCarrinhoSorvete * 0.2)
                document.getElementById("textoCarrinhoSorvete").innerHTML = custoCarrinhoSorvete
        
            }

            
        }

        function resgatarRecompensa(){
            if( localStorage.getItem("autenticado") ==1 ){
                alert("Recomoensa concebida!")
                dinheiro += 1000
                document.getElementById("textoDinheiro").innerHTML = dinheiro
            }else{
                alert("Você deve fazer o login para continuar😔")
            }


        }


    </script>


</body>

</html>
